events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream grafana {
        server grafana:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name devbuddy.org www.devbuddy.org api.devbuddy.org logs.devbuddy.org;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Frontend - devbuddy.org
    server {
        listen 443 ssl;
        server_name devbuddy.org www.devbuddy.org;

        ssl_certificate /etc/letsencrypt/live/devbuddy.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devbuddy.org/privkey.pem;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API - api.devbuddy.org
    server {
        listen 443 ssl;
        server_name api.devbuddy.org;

        ssl_certificate /etc/letsencrypt/live/devbuddy.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devbuddy.org/privkey.pem;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # Grafana - logs.devbuddy.org
    server {
        listen 443 ssl;
        server_name logs.devbuddy.org;

        ssl_certificate /etc/letsencrypt/live/devbuddy.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devbuddy.org/privkey.pem;

        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
