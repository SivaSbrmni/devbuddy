name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-hf-space.yml'
      - 'docker-compose.yml'
      - 'serve.py'
      - 'config.py'
      - 'auth.py'
      - 'main.py'
  workflow_dispatch:

concurrency:
  group: "hf-space"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # HF git auth requires oauth2:<token> as the username
          git remote add hf https://huggingface.co/spaces/Sivasbrmni/devbuddy.git || true
          git remote set-url hf "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/Sivasbrmni/devbuddy.git"
          git push hf main:main --force

      - name: Sync OLLAMA_API_KEY to HF Space secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "OLLAMA_API_KEY not set in GitHub secrets — skipping sync"
            exit 0
          fi
          pip install -q huggingface_hub
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi(token='$HF_TOKEN')
          try:
              api.add_space_secret('Sivasbrmni/devbuddy', 'OLLAMA_API_KEY', '$OLLAMA_API_KEY')
              print('OLLAMA_API_KEY secret synced to HF Space')
          except AttributeError:
              # Fallback for older huggingface_hub versions
              from huggingface_hub.utils import get_session
              import requests
              resp = get_session().post(
                  'https://huggingface.co/api/spaces/Sivasbrmni/devbuddy/secrets',
                  headers={'Authorization': f'Bearer $HF_TOKEN'},
                  json={'key': 'OLLAMA_API_KEY', 'value': '$OLLAMA_API_KEY'}
              )
              print(f'Secret sync status: {resp.status_code}')
          except Exception as e:
              print(f'Warning: could not sync secret: {e}')
          "

      - name: Trigger Factory Rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi(token='$HF_TOKEN')
          try:
              api.restart_space('Sivasbrmni/devbuddy', factory_rebuild=True)
              print('Factory rebuild triggered successfully')
          except Exception as e:
              print(f'Warning: restart_space failed: {e}')
              # Fallback: use raw API
              import requests
              resp = requests.post(
                  'https://huggingface.co/api/spaces/Sivasbrmni/devbuddy/restart',
                  headers={'Authorization': f'Bearer $HF_TOKEN'},
                  json={'factory_rebuild': True}
              )
              print(f'Fallback API status: {resp.status_code}')
              print(resp.text)
          "

      - name: Wait for HF Space to rebuild
        run: sleep 180

      - name: Smoke test backend health
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl --max-time 10 --connect-timeout 10 -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $HF_TOKEN" \
              https://sivasbrmni-devbuddy.hf.space/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/20 — backend not ready yet (status: $STATUS), waiting 20s..."
            sleep 20
          done
          echo "Smoke test failed — backend did not become healthy in time"
          exit 1
