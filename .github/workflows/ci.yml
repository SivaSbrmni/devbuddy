name: CI

on:
  push:
    branches: [main, develop, "scaffold/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: devbuddy
          POSTGRES_PASSWORD: devbuddy
          POSTGRES_DB: devbuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --select E,F,W --ignore E501 || true

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy app --ignore-missing-imports --no-strict-optional || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://devbuddy:devbuddy@localhost:5432/devbuddy
          SECRET_KEY: ci-test-secret-key-not-for-production
          LLM_PROVIDER: ollama
          LLM_MODEL: llama3.2
          WORKSPACE_ROOT: /tmp/devbuddy-workspaces
          REPOS_ROOT: /tmp/devbuddy-repos
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short || true

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint || true

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
