name: Deploy to Production
# Deploys on every push to main:
#   - Frontend → GitHub Pages (devbuddy.org)
#   - Backend  → HuggingFace Spaces (sivasbrmni-devbuddy.hf.space)
#
# Required secrets:
#   - HF_TOKEN (HuggingFace write token — from https://huggingface.co/settings/tokens)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  HF_SPACE: 'sivasbrmni/devbuddy'
  VITE_API_URL: 'https://sivasbrmni-devbuddy.hf.space'
  DOMAIN: 'devbuddy.org'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & Deploy Frontend → GitHub Pages
  # ───────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_API_BASE_URL: ${{ env.VITE_API_URL }}

      - name: Add CNAME for custom domain
        run: echo "${{ env.DOMAIN }}" > frontend/dist/CNAME

      - name: Add 404.html for SPA routing
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Deploy Backend → HuggingFace Spaces
  # ───────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (HuggingFace Spaces)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git for the push
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone the HF Space repo
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/${{ env.HF_SPACE }} hf-space
          cd hf-space

          # Clear old files (except .git)
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

          # Copy backend files
          cp -r ../backend/* .
          cp -r ../backend/.* . 2>/dev/null || true

          # Ensure Dockerfile exists for the Space
          if [ ! -f Dockerfile ]; then
            cp ../backend/Dockerfile .
          fi

          # Commit and push
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC') from ${GITHUB_SHA::8}"
          git push

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Smoke Tests
  # ───────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Post-Deploy Smoke Tests
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployments to propagate
        run: sleep 60

      - name: Test frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.DOMAIN }})
          echo "Frontend status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Frontend returned $STATUS (may still be propagating)"
          fi

      - name: Test backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sivasbrmni-devbuddy.hf.space/health)
          echo "Backend health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend returned $STATUS (Space may be waking up)"
          fi
