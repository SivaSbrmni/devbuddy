name: Deploy to Production
# Single-push deploy: Cloudflare Pages (frontend) + Fly.io (backend)
# Required secrets:
#   - CLOUDFLARE_API_TOKEN (from dash.cloudflare.com → My Profile → API Tokens)
#   - CLOUDFLARE_ACCOUNT_ID (from Workers & Pages sidebar)
#   - FLY_API_TOKEN (from fly.io tokens create)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  VITE_SUPABASE_URL: 'https://oahumeurdneffekoerqa.supabase.co'
  VITE_SUPABASE_ANON_KEY: 'sb_publishable_WCXQKuSKkQ268IRrpcxm7w_fZDBEqMO'
  VITE_API_BASE_URL: 'https://devbuddy-backend.fly.dev'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build Frontend
  # ───────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Deploy Frontend → Cloudflare Pages
  # ───────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy to Cloudflare Pages
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: devbuddy
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Deploy Backend → Fly.io
  # ───────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy to Fly.io
    needs: deploy-frontend  # Deploy backend after frontend (so frontend doesn't point to old backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Run database migrations
        run: |
          flyctl ssh console --command "cd /app && alembic upgrade head"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Smoke Tests
  # ───────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Test health endpoint
        run: |
          sleep 10  # Give services time to warm up
          curl -sf https://devbuddy-backend.fly.dev/health || exit 1
          echo "Backend health OK"

      - name: Test frontend reachable
        run: |
          FRONTEND_URL="https://devbuddy.pages.dev"
          curl -sf "$FRONTEND_URL" || exit 1
          echo "Frontend reachable OK"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployed commit ${{ github.sha }} successfully!"
          echo "Frontend: https://devbuddy.pages.dev"
          echo "Backend:  https://devbuddy-backend.fly.dev"
