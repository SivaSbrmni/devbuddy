name: Deploy
# Deploys to a GCP e2-micro VM via SSH.
# Builds Docker images directly on the VM (no registry needed — free tier).
# Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Increase timeout for docker build on e2-micro (slow CPU)
          command_timeout: 30m
          script: |
            set -e
            cd /opt/devbuddy

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Ensuring data directories exist"
            mkdir -p /opt/devbuddy/data/{postgres,loki,grafana,workspaces,repos}

            echo "==> Building and starting services"
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Cleaning up old images"
            docker image prune -f

            echo "==> Service status"
            docker compose -f docker-compose.prod.yml ps

            echo "Deployed commit $(git rev-parse --short HEAD) at $(date)"
