# Production docker-compose — data stored in /opt/devbuddy/data/ (persistent disk)
# All named volumes replaced with bind mounts so data survives VM reboots.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_ROOT:-/opt/devbuddy/data}/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: devbuddy-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOKI_URL: http://loki:3100
      WORKSPACE_ROOT: ${DATA_ROOT:-/opt/devbuddy/data}/workspaces
      REPOS_ROOT: ${DATA_ROOT:-/opt/devbuddy/data}/repos
      # AEP /LLM gateway target — internal network, never exposed publicly.
      # Phase 1 only takes effect when `llm_gateway_enabled` is on.
      AEP_OLLAMA_BASE_URL: ${AEP_OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      AEP_DEFAULT_MODEL: ${AEP_DEFAULT_MODEL:-gemma4:31b-cloud}
      AEP_EMBEDDING_MODEL: ${AEP_EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ${DATA_ROOT:-/opt/devbuddy/data}/workspaces:${DATA_ROOT:-/opt/devbuddy/data}/workspaces
      - ${DATA_ROOT:-/opt/devbuddy/data}/repos:${DATA_ROOT:-/opt/devbuddy/data}/repos
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web

  # AEP Phase 1 — Ollama sidecar (spec §2.1, §2.2).
  # Co-hosted with the backend on the internal network so the `/LLM`
  # gateway can proxy requests over `http://ollama:11434` without
  # exposing the upstream beyond the VM.
  #
  # GCP topology notes:
  #   * Runs in the same e2-micro VM as the backend by default.
  #   * For a 31B-class model that exceeds e2-micro RAM, point
  #     `AEP_OLLAMA_BASE_URL` at a separate GPU VM or at Ollama Cloud
  #     (set `OLLAMA_CLOUD_API_KEY`) and keep this service disabled.
  #   * Model cache persists under `${DATA_ROOT}/ollama` so the
  #     container survives VM reboots without re-pulling models.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ${DATA_ROOT:-/opt/devbuddy/data}/ollama:/root/.ollama
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    image: devbuddy-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    networks:
      - web

  loki:
    image: grafana/loki:2.9.3
    restart: unless-stopped
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml
      - ${DATA_ROOT:-/opt/devbuddy/data}/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal

  promtail:
    image: grafana/promtail:2.9.3
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${DATA_ROOT:-/opt/devbuddy/data}/grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal
      - web
    depends_on:
      - loki

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - web
    depends_on:
      - backend
      - frontend
      - grafana

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
