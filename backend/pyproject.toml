[project]
name = "devbuddy-lite"
version = "0.1.0"
description = "Autonomous Software Engineering Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "python-dotenv==1.1.0",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    "pgvector==0.3.6",
    "anthropic==0.52.0",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "aiofiles==24.1.0",
    "gitpython==3.1.44",
    "PyGithub==2.6.1",
    "structlog==25.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
