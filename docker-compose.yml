services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devbuddy_pass}
      POSTGRES_DB: ${POSTGRES_DB:-devbuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbuddy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devbuddy}:${POSTGRES_PASSWORD:-devbuddy_pass}@postgres:5432/${POSTGRES_DB:-devbuddy}
      LOKI_URL: http://loki:3100
      # AEP /LLM gateway target. Reached over the internal Docker network;
      # never exposed to the host. Phase 1 only takes effect when the
      # `llm_gateway_enabled` feature flag is on.
      AEP_OLLAMA_BASE_URL: ${AEP_OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      AEP_DEFAULT_MODEL: ${AEP_DEFAULT_MODEL:-gemma4:31b-cloud}
      AEP_EMBEDDING_MODEL: ${AEP_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # AEP Phase 1 — Ollama sidecar. Co-located with the backend on the
  # internal network so the `/LLM` gateway can proxy requests over
  # `http://ollama:11434` without exposing the upstream to the host.
  # When `OLLAMA_CLOUD_API_KEY` is set the sidecar acts as a thin local
  # proxy to Ollama Cloud (per `gemma4:31b-cloud` requirement in spec §2.1);
  # otherwise it serves models locally from the persistent volume.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.3
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.3
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  ollama_data:
