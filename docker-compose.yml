version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devbuddy
      POSTGRES_PASSWORD: devbuddy
      POSTGRES_DB: devbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devbuddy:devbuddy@db:5432/devbuddy
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - workspaces:/tmp/devbuddy-workspaces
      - repos:/tmp/devbuddy-repos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  workspaces:
  repos:
