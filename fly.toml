# fly.toml — Fly.io backend configuration
# Deploy with: fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = 'devbuddy-backend'
primary_region = 'iad'  # US East (N. Virginia) — change to your region

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  ENVIRONMENT = 'production'
  PORT = '8000'
  # These are set via fly secrets:
  #   fly secrets set DATABASE_URL="..."
  #   fly secrets set SECRET_KEY="..."
  #   fly secrets set SUPABASE_JWT_SECRET="..."
  #   fly secrets set LLM_API_KEY="..."
  #   fly secrets set SENTRY_DSN="..."

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'
  method = 'GET'
  path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512  # Fly.io free tier allows 256MB shared, but 512MB for $1.94/mo is safer

# Persistent volume for workspace data (clones, generated files)
[[mounts]]
  source = 'devbuddy_data'
  destination = '/data'
